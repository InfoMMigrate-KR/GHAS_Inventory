name: Assign Secret Scanning Alerts

on:
    # Allow manual triggering
    workflow_dispatch:
        inputs:
            csv_file:
                description: "Path to secret scanning CSV file (relative to repository root)"
                required: true
                default: "scripts/output/fetch_secret_scanning/secret_scanning_YYYYMMDD_HHMMSS.csv"
                type: string
            dry_run:
                description: "Dry-run mode (preview assignments without making API calls)"
                required: false
                default: true
                type: boolean

jobs:
    assign-alerts:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install requests pandas python-dotenv

            - name: Create output directory
              run: mkdir -p scripts/output/assign_alerts

            - name: Assign secret scanning alerts
              env:
                  GH_PATS: ${{ secrets.GH_PATS }}
                  GITHUB_TOKEN: ${{ secrets.GH_PATS }}
              run: |
                  cd scripts/assign_alerts
                  if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
                      python assign_alerts.py --csv-file ../../${{ github.event.inputs.csv_file }} --dry-run
                  else
                      python assign_alerts.py --csv-file ../../${{ github.event.inputs.csv_file }}
                  fi

            - name: Upload assignment report
              uses: actions/upload-artifact@v5
              with:
                  name: alert-assignments-${{ github.run_id }}
                  path: scripts/output/assign_alerts/
                  retention-days: 30

            - name: List generated files
              run: |
                  echo "Generated assignment report:"
                  ls -la scripts/output/assign_alerts/

            - name: Display assignment summary
              if: always()
              run: |
                  if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
                      echo "✓ Dry-run completed - No assignments were made"
                      echo "Review the logs above for assignment preview"
                  else
                      echo "✓ Assignment process completed"
                      echo "Check the logs above for success/failure details"
                  fi

# Security Notes:
# 1. Store GH_PATS as a repository secret
# 2. Token must have the following scopes:
#    - 'repo' (for repository access)
#    - 'security_events' (for secret scanning alert management)
# 3. The workflow can be run in dry-run mode to preview assignments
# 4. Assignment reports will be available as workflow artifacts for 30 days
# 5. Use the 'csv_file' input to specify which CSV file to process

# Usage Examples:
# - Dry-run mode: Set dry_run=true to preview assignments
# - Production mode: Set dry_run=false to actually assign alerts
# - CSV file path: Provide the path relative to repository root
#   Example: scripts/output/fetch_secret_scanning/secret_scanning_20251219_163836.csv
