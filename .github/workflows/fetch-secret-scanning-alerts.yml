name: Fetch Secret Scanning Alerts

on:
    # Run on schedule (daily at 6 AM UTC)
    schedule:
        - cron: "0 6 * * *"

    # Allow manual triggering
    workflow_dispatch:
        inputs:
            alert_state:
                description: "Alert state to fetch"
                required: false
                default: "open"
                type: choice
                options:
                    - "open"
                    - "resolved"
                    - "all"
            output_format:
                description: "Output format"
                required: false
                default: "xlsx"
                type: choice
                options:
                    - "xlsx"
                    - "csv"
                    - "both"

jobs:
    fetch-secret-scanning-alerts:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install requests pandas openpyxl python-dotenv

            - name: Create output directory
              run: mkdir -p scripts/output

            - name: Fetch secret scanning alerts
              env:
                  GH_ENTERPRISE_SLUG: ${{ secrets.GH_ENTERPRISE_SLUG }}
                  GH_PATS: ${{ secrets.GH_PATS }}
                  ALERT_STATE: ${{ github.event.inputs.alert_state || 'open' }}
                  OUTPUT_FORMAT: ${{ github.event.inputs.output_format || 'xlsx' }}
              run: |
                  cd scripts
                  python fetch_secret_scanning_alerts.py

            - name: Upload results as artifact
              uses: actions/upload-artifact@v3
              with:
                  name: secret-scanning-alerts-${{ github.run_id }}
                  path: scripts/output/
                  retention-days: 30

            - name: List generated files
              run: |
                  echo "Generated files:"
                  ls -la scripts/output/

# Security Notes:
# 1. Store GH_ENTERPRISE_SLUG and GH_PATS as repository secrets
# 2. GH_PATS should contain comma-separated GitHub Personal Access Tokens
# 3. Each token should have 'read:enterprise' scope for accessing enterprise security alerts
# 4. Generated reports will be available as workflow artifacts for 30 days
