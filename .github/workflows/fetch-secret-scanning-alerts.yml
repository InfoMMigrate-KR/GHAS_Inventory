name: Fetch Secret Scanning Alerts

on:
    # Run on schedule (daily at 6 AM UTC)
    # schedule:
    #     - cron: "0 6 * * *"

    # Allow manual triggering
    workflow_dispatch:
        inputs:
            alert_state:
                description: "Alert state to fetch"
                required: false
                default: "open"
                type: choice
                options:
                    - "all"
                    - "open"
                    - "resolved"
            output_format:
                description: "Output format"
                required: false
                default: "xlsx"
                type: choice
                options:
                    - "csv"
                    - "xlsx"
                    - "both"

jobs:
    fetch-secret-scanning-alerts:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install -r scripts/fetch-secret-scanning/requirements.txt

            - name: Create output directory
              run: mkdir -p scripts/output

            - name: Fetch secret scanning alerts
              env:
                  GH_ENTERPRISE_SLUG: ${{ vars.GH_ENTERPRISE_SLUG }}
                  GH_APP_ID: ${{ vars.GH_APP_ID }}
                  GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
                  GH_PATS: ${{ secrets.GH_PATS }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ALERT_STATE: ${{ github.event.inputs.alert_state || 'all' }}
                  OUTPUT_FORMAT: ${{ github.event.inputs.output_format || 'csv' }}
              run: |
                  cd scripts/fetch-secret-scanning
                  python fetch_secret_scanning_alerts_githubApp.py

            - name: Upload results as artifact
              uses: actions/upload-artifact@v5
              with:
                  name: secret-scanning-alerts-${{ github.run_id }}
                  path: scripts/output/fetch_secret_scanning/
                  retention-days: 30

            - name: List generated files
              run: |
                  echo "Generated files:"
                  ls -la scripts/output/

# Security Notes:
# 1. Store GH_ENTERPRISE_SLUG and GH_PATS as repository secrets
# 2. GH_PATS should contain comma-separated GitHub Personal Access Tokens
# 3. Each token should have 'repo' scope for accessing enterprise security alerts
# 4. Generated reports will be available as workflow artifacts for 30 days
