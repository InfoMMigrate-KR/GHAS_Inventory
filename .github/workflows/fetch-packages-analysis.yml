name: Analyze Package Dependencies

on:
    workflow_dispatch:
        inputs:
            enterprise_slug:
                description: "GitHub Enterprise Slug"
                required: false
                type: string
                default: "infomagnus-partner-demo"
            cleanup_old_files:
                description: "Clean up old files (older than 7 days)"
                required: false
                type: boolean
                default: true
    # schedule:
    #     # Run monthly on the 15th at 3:00 AM UTC
    #     - cron: "0 3 15 * *"

env:
    PYTHON_VERSION: "3.11"

jobs:
    package-analysis:
        name: Enterprise Package Dependencies Analysis
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  # Install additional dependencies for fetch-packages-org.py
                  pip install -r scripts/ORG-Fetch-Packages/requirements.txt

            - name: Validate environment variables
              run: |
                  if [ -z "${{ vars.GH_ENTERPRISE_SLUG }}" ] && [ -z "${{ inputs.enterprise_slug }}" ]; then
                    echo "ERROR: GH_ENTERPRISE_SLUG not found in variables and not provided as input"
                    exit 1
                  fi

                  if [ -z "${{ vars.GH_APP_ID }}" ]; then
                    echo "ERROR: GH_APP_ID not found in repository variables"
                    echo "Please add your GitHub App ID to repository variables"
                    exit 1
                  fi

                  if [ -z "${{ secrets.GH_PRIVATE_KEY }}" ]; then
                    echo "ERROR: GH_PRIVATE_KEY not found in repository secrets"
                    echo "Please add your GitHub App private key content to repository secrets"
                    exit 1
                  fi

                  echo "Environment validation passed ✓"

            - name: Setup GitHub App Private Key
              run: |
                  echo "GitHub App private key configured from secrets"
                  echo "✓ Private key setup completed"

            - name: Set enterprise slug and SSL verification
              run: |
                  if [ -n "${{ inputs.enterprise_slug }}" ]; then
                    echo "GH_ENTERPRISE_SLUG=${{ inputs.enterprise_slug }}" >> $GITHUB_ENV
                  else
                    echo "GH_ENTERPRISE_SLUG=${{ vars.GH_ENTERPRISE_SLUG }}" >> $GITHUB_ENV
                  fi

                  echo "VERIFY_SSL=${{ inputs.verify_ssl }}" >> $GITHUB_ENV

            - name: Create output directories
              run: |
                  mkdir -p scripts/output/fetch_packages/logs
                  mkdir -p scripts/output
                  echo "Created output directories"

            - name: Fetch Organizations
              env:
                  GH_ENTERPRISE_SLUG: ${{ vars.GH_ENTERPRISE_SLUG }}
                  GH_APP_ID: ${{ vars.GH_APP_ID }}
                  GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
              run: |
                  echo "============================================"
                  echo "Fetching Organizations"
                  echo "============================================"

                  # Run fetch_orgs.py to generate organizations.csv
                  python scripts/fetch_Orgs/fetch_orgs.py

                  # Verify the file was created
                  if [ ! -f "scripts/output/organizations.csv" ]; then
                    echo "ERROR: organizations.csv was not created by fetch_orgs.py"
                    exit 1
                  fi

                  # Show count of organizations
                  ORG_COUNT=$(tail -n +2 scripts/output/organizations.csv | wc -l)
                  echo "Organizations found: $ORG_COUNT"

                  if [ "$ORG_COUNT" -eq 0 ]; then
                    echo "ERROR: No organizations found in CSV"
                    exit 1
                  fi

                  echo "✓ Organizations fetched successfully"

            - name: Run Package Dependencies Analysis
              env:
                  GH_ENTERPRISE_SLUG: ${{ vars.GH_ENTERPRISE_SLUG }}
                  GH_APP_ID: ${{ vars.GH_APP_ID }}
                  GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
                  VERIFY_SSL: ${{ env.VERIFY_SSL }}
              run: |
                  echo "============================================"
                  echo "GitHub Enterprise Package Dependencies Analysis"
                  echo "============================================"
                  echo "Enterprise: ${{ vars.GH_ENTERPRISE_SLUG }}"
                  echo "GitHub App ID: ${{ vars.GH_APP_ID }}"
                  echo "Private Key: [CONFIGURED FROM SECRETS]"
                  echo "SSL Verification: ${{ env.VERIFY_SSL }}"
                  echo "This may take several minutes depending on enterprise size and number of repositories."
                  echo ""

                  # Debug: Check environment variables
                  echo "Environment variables check:"
                  echo "GH_ENTERPRISE_SLUG is set: $([ -n "$GH_ENTERPRISE_SLUG" ] && echo 'YES' || echo 'NO')"
                  echo "GH_APP_ID is set: $([ -n "$GH_APP_ID" ] && echo 'YES' || echo 'NO')"
                  echo "GH_PRIVATE_KEY is set: $([ -n "$GH_PRIVATE_KEY" ] && echo 'YES' || echo 'NO')"
                  echo "VERIFY_SSL is set: $([ -n "$VERIFY_SSL" ] && echo 'YES' || echo 'NO')"
                  echo ""

                  # Change to script directory
                  cd scripts/ORG-Fetch-Packages

                  # Run package dependencies analysis with timeout (3 hours)
                  timeout 10800 python fetch-packages-org.py || {
                    exit_code=$?
                    if [ $exit_code -eq 124 ]; then
                      echo "ERROR: Package analysis timed out after 3 hours"
                      exit 1
                    else
                      echo "ERROR: Package analysis failed with exit code $exit_code"
                      exit $exit_code
                    fi
                  }

                  echo "✓ Package dependencies analysis completed successfully"

            - name: Validate Output Files
              run: |
                  echo "============================================"
                  echo "Validating Output Files"
                  echo "============================================"

                  OUTPUT_DIR="scripts/output/fetch_packages"

                  echo "Checking output files..."

                  # Find the latest timestamped files
                  LATEST_DEPENDENCIES=$(ls -t $OUTPUT_DIR/github_dependencies_*.csv 2>/dev/null | head -1)
                  LATEST_ACCESS_ISSUES=$(ls -t $OUTPUT_DIR/packages_org_access_issues_*.csv 2>/dev/null | head -1)

                  # Validate timestamped files
                  if [ ! -f "$LATEST_DEPENDENCIES" ]; then
                    echo "WARNING: No package dependencies file found (may be expected if no packages found)"
                  else
                    echo "✓ Package dependencies: $(basename $LATEST_DEPENDENCIES)"
                    
                    # Count dependencies
                    DEP_COUNT=$(tail -n +2 "$LATEST_DEPENDENCIES" | wc -l)
                    echo "  Total dependencies found: $DEP_COUNT"
                  fi

                  if [ ! -f "$LATEST_ACCESS_ISSUES" ]; then
                    echo "WARNING: No access issues file found"
                  else
                    echo "✓ Access issues log: $(basename $LATEST_ACCESS_ISSUES)"
                    
                    # Count access issues
                    ISSUE_COUNT=$(tail -n +2 "$LATEST_ACCESS_ISSUES" | wc -l)
                    if [ "$ISSUE_COUNT" -gt 0 ]; then
                      echo "  Organizations with access issues: $ISSUE_COUNT"
                    else
                      echo "  No access issues found"
                    fi
                  fi

                  echo "✓ Output validation completed"

            - name: Generate Package Analysis Summary
              run: |
                  echo "============================================"
                  echo "PACKAGE ANALYSIS SUMMARY"
                  echo "============================================"

                  OUTPUT_DIR="scripts/output/fetch_packages"

                  echo "Enterprise: ${{ vars.GH_ENTERPRISE_SLUG }}"
                  echo "Workflow completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  echo ""

                  echo "Generated Files:"
                  echo "----------------"

                  # List all output files with sizes
                  find "$OUTPUT_DIR" -type f -name "*.csv" | sort | while read file; do
                    if [ -f "$file" ]; then
                      size=$(du -h "$file" | cut -f1)
                      rel_path=$(basename "$file")
                      echo "  $rel_path ($size)"
                    fi
                  done

                  # Summary statistics from dependencies files
                  echo ""
                  echo "Package Dependencies Summary:"
                  echo "----------------------------"

                  TOTAL_DEPENDENCIES=0
                  TOTAL_REPOS=0
                  PACKAGE_TYPES=""

                  for dep_file in $OUTPUT_DIR/github_dependencies_*.csv; do
                    if [ -f "$dep_file" ]; then
                      # Count dependencies in this file (excluding header)
                      DEP_COUNT=$(tail -n +2 "$dep_file" | wc -l)
                      TOTAL_DEPENDENCIES=$((TOTAL_DEPENDENCIES + DEP_COUNT))
                      
                      # Count unique repositories
                      REPO_COUNT=$(tail -n +2 "$dep_file" | cut -d',' -f2 | sort -u | wc -l)
                      TOTAL_REPOS=$((TOTAL_REPOS + REPO_COUNT))
                      
                      # Get package types
                      TYPES=$(tail -n +2 "$dep_file" | cut -d',' -f3 | sort -u | tr '\n' ', ')
                      PACKAGE_TYPES="$PACKAGE_TYPES $TYPES"
                    fi
                  done

                  if [ "$TOTAL_DEPENDENCIES" -gt 0 ]; then
                    echo "Total dependencies found: $TOTAL_DEPENDENCIES"
                    echo "Total repositories with packages: $TOTAL_REPOS"
                    echo "Package types detected: $(echo $PACKAGE_TYPES | tr ' ' '\n' | sort -u | tr '\n' ', ' | sed 's/,$//')"
                  else
                    echo "No package dependencies found across all organizations"
                  fi

                  # Check for access issues
                  TOTAL_ISSUES=0
                  for issue_file in $OUTPUT_DIR/packages_org_access_issues_*.csv; do
                    if [ -f "$issue_file" ]; then
                      ISSUE_COUNT=$(tail -n +2 "$issue_file" | wc -l)
                      TOTAL_ISSUES=$((TOTAL_ISSUES + ISSUE_COUNT))
                    fi
                  done

                  echo ""
                  if [ "$TOTAL_ISSUES" -gt 0 ]; then
                    echo "⚠️  Organizations with access issues: $TOTAL_ISSUES"
                    echo "Check the artifacts for detailed access issue information."
                  else
                    echo "✅ No access issues encountered"
                  fi

                  echo ""
                  echo "🎉 Package dependencies analysis workflow completed successfully!"

            - name: Clean up old files
              if: ${{ inputs.cleanup_old_files == true }}
              run: |
                  echo "============================================"
                  echo "CLEANING UP OLD FILES"
                  echo "============================================"

                  OUTPUT_DIR="scripts/output/fetch_packages"

                  # Find files older than 7 days
                  OLD_FILES=$(find "$OUTPUT_DIR" -type f -mtime +7 2>/dev/null || true)

                  if [ -n "$OLD_FILES" ]; then
                    echo "Removing old files:"
                    echo "$OLD_FILES" | while read file; do
                      if [ -f "$file" ]; then
                        echo "  Removing: $(basename "$file")"
                        rm -f "$file"
                      fi
                    done
                    
                    CLEANED_COUNT=$(echo "$OLD_FILES" | wc -l)
                    echo "✓ Cleaned up $CLEANED_COUNT old files"
                  else
                    echo "No old files to clean up"
                  fi

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: package-dependencies-results-${{ github.run_number }}
                  path: |
                      scripts/output/fetch_packages/*.csv
                      scripts/output/fetch_packages/logs/*.log
                      scripts/output/organizations.csv
                  retention-days: 30

            - name: Upload organizations list
              uses: actions/upload-artifact@v4
              if: success()
              with:
                  name: organizations-list-${{ github.run_number }}
                  path: scripts/output/organizations.csv
                  retention-days: 90

            - name: Upload detailed package dependencies
              uses: actions/upload-artifact@v4
              if: success()
              with:
                  name: package-dependencies-details-${{ github.run_number }}
                  path: scripts/output/fetch_packages/github_dependencies_*.csv
                  retention-days: 60
# Security Notes:
# 1. Store GH_APP_ID as repository variable
# 2. Store GH_PRIVATE_KEY as repository secret
# 3. Store GH_ENTERPRISE_SLUG as repository variable
# 4. The GitHub App should have the following permissions:
#    - Repository: Read access to metadata, contents
#    - Organization: Read access to members
# 5. Generated reports will be available as workflow artifacts for 30-90 days
# 6. Package dependencies analysis may take significant time for large enterprises
