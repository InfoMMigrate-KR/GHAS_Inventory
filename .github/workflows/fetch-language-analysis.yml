name: GitHub Enterprise Language Analysis

on:
  workflow_dispatch:
    inputs:
      enterprise_slug:
        description: "GitHub Enterprise Slug"
        required: false
        type: string
        default: "infomagnus-partner-demo"
      cleanup_old_files:
        description: "Clean up old files (older than 7 days)"
        required: false
        type: boolean
        default: true
  # schedule:
  #     # Run monthly on the 1st at 2:00 AM UTC
  #     - cron: "0 2 1 * *"

env:
  PYTHON_VERSION: "3.11"

jobs:
  language-analysis:
    name: Enterprise Language Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate environment variables
        run: |
          if [ -z "${{ vars.GH_ENTERPRISE_SLUG }}" ] && [ -z "${{ inputs.enterprise_slug }}" ]; then
            echo "ERROR: GH_ENTERPRISE_SLUG not found in variables and not provided as input"
            exit 1
          fi

          if [ -z "${{ vars.GH_APP_ID }}" ]; then
            echo "ERROR: GH_APP_ID not found in repository variables"
            echo "Please add your GitHub App ID to repository variables"
            exit 1
          fi

          if [ -z "${{ secrets.GH_PRIVATE_KEY }}" ]; then
            echo "ERROR: GH_PRIVATE_KEY not found in repository secrets"
            echo "Please add your GitHub App private key content to repository secrets"
            exit 1
          fi

          echo "Environment validation passed ✓"

      - name: Setup GitHub App Private Key
        run: |
          # Create temporary directory for private key
          mkdir -p /tmp/github-app

          # Write private key content to file
          echo "${{ secrets.GH_PRIVATE_KEY }}" > /tmp/github-app/private-key.pem
          chmod 600 /tmp/github-app/private-key.pem

          # Set environment variables for both scripts
          echo "GH_PRIVATE_KEY_PATH=/tmp/github-app/private-key.pem" >> $GITHUB_ENV
          echo "GH_PRIVATE_KEY=/tmp/github-app/private-key.pem" >> $GITHUB_ENV
            exit 1
          fi

          # Show count of organizations
          ORG_COUNT=$(tail -n +2 scripts/output/organizations.csv | wc -l)
          echo "Organizations found: $ORG_COUNT"

          if [ "$ORG_COUNT" -eq 0 ]; then
            echo "ERROR: No organizations found in CSV"
            exit 1
          fi

          echo "✓ Organizations fetched successfully"

      - name: Run Language Analysis
        env:
          GH_ENTERPRISE_SLUG: ${{ vars.GH_ENTERPRISE_SLUG }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
        run: |
          echo "============================================"
          echo "GitHub Enterprise Language Analysis"
          echo "============================================"
          echo "Enterprise: ${{ vars.GH_ENTERPRISE_SLUG }}"
          echo "GitHub App ID: ${{ vars.GH_APP_ID }}"
          echo "Private Key Path: $GH_PRIVATE_KEY"
          echo "This may take several minutes depending on enterprise size."
          echo ""

          # Debug: Check environment variables
          echo "Environment variables check:"
          echo "GH_ENTERPRISE_SLUG is set: $([ -n "$GH_ENTERPRISE_SLUG" ] && echo 'YES' || echo 'NO')"
          echo "GH_APP_ID is set: $([ -n "$GH_APP_ID" ] && echo 'YES' || echo 'NO')"
          echo "GH_PRIVATE_KEY is set: $([ -n "$GH_PRIVATE_KEY" ] && echo 'YES' || echo 'NO')"
          echo "Private key file exists: $([ -f "$GH_PRIVATE_KEY" ] && echo 'YES' || echo 'NO')"
          echo ""

          # Run language analysis with timeout
          timeout 7200 python scripts/fetch_languages/fetch_languages_githubAPP.py || {
            exit_code=$?
            if [ $exit_code -eq 124 ]; then
              echo "ERROR: Language analysis timed out after 2 hours"
              exit 1
            else
              echo "ERROR: Language analysis failed with exit code $exit_code"
              exit $exit_code
            fi
          }

          echo "✓ Language analysis completed successfully"

      - name: Validate Output Files
        run: |
          echo "============================================"
          echo "Validating Output Files"
          echo "============================================"

          OUTPUT_DIR="scripts/output/fetch_languages"

          echo "Checking output files..."

          # Find the latest timestamped files
          LATEST_REPORT=$(ls -t $OUTPUT_DIR/languages_report_*.csv 2>/dev/null | head -1)
          LATEST_SUMMARY=$(ls -t $OUTPUT_DIR/languages_summary_*.csv 2>/dev/null | head -1)
          LATEST_ERRORS=$(ls -t $OUTPUT_DIR/languages_errors_*.csv 2>/dev/null | head -1)

          # Validate timestamped files
          if [ ! -f "$LATEST_REPORT" ]; then
            echo "ERROR: No languages report file found"
            exit 1
          fi
          echo "✓ Language report: $(basename $LATEST_REPORT)"

          if [ ! -f "$LATEST_SUMMARY" ]; then
            echo "WARNING: No summary report found (may be expected if no data)"
          else
            echo "✓ Language summary: $(basename $LATEST_SUMMARY)"
          fi

          if [ ! -f "$LATEST_ERRORS" ]; then
            echo "WARNING: No errors file found"
          else
            echo "✓ Errors log: $(basename $LATEST_ERRORS)"
          fi

          echo "✓ Output validation completed"

      - name: Generate Workflow Summary
        run: |
          echo "============================================"
          echo "WORKFLOW SUMMARY"
          echo "============================================"

          OUTPUT_DIR="scripts/output/fetch_languages"

          echo "Enterprise: ${{ vars.GH_ENTERPRISE_SLUG }}"
          echo "Workflow completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          echo "Generated Files:"
          echo "----------------"

          # List all output files with sizes
          find "$OUTPUT_DIR" -type f -name "*.csv" -o -name "*.log" | sort | while read file; do
            size=$(du -h "$file" | cut -f1)
            rel_path=$(basename "$file")
            echo "  $rel_path ($size)"
          done

          # Count language records if summary exists
          LATEST_SUMMARY=$(ls -t $OUTPUT_DIR/languages_summary_*.csv 2>/dev/null | head -1)
          if [ -f "$LATEST_SUMMARY" ]; then
            LANG_COUNT=$(tail -n +2 "$LATEST_SUMMARY" | wc -l)
            echo ""
            echo "Languages detected: $LANG_COUNT"
          fi

          # Check for errors
          LATEST_ERRORS=$(ls -t $OUTPUT_DIR/languages_errors_*.csv 2>/dev/null | head -1)
          if [ -f "$LATEST_ERRORS" ]; then
            ERROR_COUNT=$(tail -n +2 "$LATEST_ERRORS" | wc -l)
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo ""
              echo "⚠️  Organizations with errors: $ERROR_COUNT"
              echo "Check the artifacts for detailed error information."
            fi
          fi

          echo ""
          echo "🎉 Language analysis workflow completed successfully!"

      - name: Clean up old files
        if: ${{ inputs.cleanup_old_files == true }}
        run: |
          echo "============================================"
          echo "CLEANING UP OLD FILES"
          echo "============================================"

          OUTPUT_DIR="scripts/output/fetch_languages"

          # Find files older than 7 days (exclude organizations.csv)
          OLD_FILES=$(find "$OUTPUT_DIR" -type f -mtime +7 ! -name "organizations.csv" 2>/dev/null || true)

          if [ -n "$OLD_FILES" ]; then
            echo "Removing old files:"
            echo "$OLD_FILES" | while read file; do
              echo "  Removing: $(basename "$file")"
              rm -f "$file"
            done
            
            CLEANED_COUNT=$(echo "$OLD_FILES" | wc -l)
            echo "✓ Cleaned up $CLEANED_COUNT old files"
          else
            echo "No old files to clean up"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-analysis-results-${{ github.run_number }}
          path: |
            scripts/output/fetch_languages/*.csv
            scripts/output/fetch_languages/logs/*.log
            scripts/output/fetch_languages/logs/*.csv
            scripts/output/organizations.csv
          retention-days: 30

      - name: Upload organizations list
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: organizations-list-${{ github.run_number }}
          path: scripts/output/organizations.csv
          retention-days: 90
