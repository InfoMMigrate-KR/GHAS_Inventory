name: Fetch Secret Scanning Alerts (PAT)

on:
  workflow_dispatch:
    inputs:
      alert_state:
        description: 'Alert state to fetch (open, resolved, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - open
          - resolved
      output_format:
        description: 'Output format (csv, xlsx, both)'
        required: false
        default: 'csv'
        type: choice
        options:
          - csv
          - xlsx
          - both
      enable_commit_enrichment:
        description: 'Enable commit enrichment (fetches committer info)'
        required: false
        default: false
        type: boolean
      enable_repo_admin_enrichment:
        description: 'Enable repository admin enrichment'
        required: false
        default: false
        type: boolean
      test_mode:
        description: 'Enable test mode (limited results)'
        required: false
        default: false
        type: boolean
      test_limit:
        description: 'Number of alerts in test mode'
        required: false
        default: '20'
      secret_types:
        description: 'Comma-separated secret types (or "all" for default patterns)'
        required: false
        default: 'all'
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  fetch-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/fetch-secret-scanning/requirements.txt

      - name: Run secret scanning alerts fetcher
        env:
          GH_ENTERPRISE_SLUG: ${{ secrets.GH_ENTERPRISE_SLUG }}
          GH_PATS: ${{ secrets.GH_PATS }}
          ALERT_STATE: ${{ github.event.inputs.alert_state || 'all' }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format || 'csv' }}
          OUTPUT_FILENAME: 'secret_scanning_report'
          ENABLE_COMMIT_ENRICHMENT: ${{ github.event.inputs.enable_commit_enrichment || 'false' }}
          ENABLE_REPO_ADMIN_ENRICHMENT: ${{ github.event.inputs.enable_repo_admin_enrichment || 'false' }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit || '20' }}
          SECRET_TYPES: ${{ github.event.inputs.secret_types || 'all' }}
        run: |
          python scripts/fetch-secret-scanning/fetch_secret_scanning_alerts.py

      - name: Upload output files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scanning-reports-${{ github.run_number }}
          path: |
            scripts/fetch-secret-scanning/output/*.csv
            scripts/fetch-secret-scanning/output/*.xlsx
          retention-days: 90

      - name: Upload log files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scanning-logs-${{ github.run_number }}
          path: scripts/fetch-secret-scanning/output/logs/*.log
          retention-days: 30

      - name: Commit and push output files
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/fetch-secret-scanning/output/*.csv scripts/fetch-secret-scanning/output/*.xlsx || true
          git diff --staged --quiet || git commit -m "chore: update secret scanning reports [skip ci]"
          git push || true
